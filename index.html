<!DOCTYPE html>
<html>

<head>
	<title>Algorithm Visualization</title>
	<link rel="stylesheet" type="text/css" href="styles/main.css">
	<link rel="icon" href="favicon.png" type="image/gif" sizes="32x32">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="styles/magic.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
	<script src="https://kit.fontawesome.com/d1f3dd87b7.js" crossorigin="anonymous"></script>
</head>

<body>
	<nav class="navbar navbar-expand-sm fixed-top navbar-dark bg-dark" id="myNavbar">
		<a class="navbar-brand" href="#" id="logo">Algorithm Visualization</a>
		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item">
					<span class="nav-link nav-fixed-label" id="algorithmLabel">DFS</span>
				</li>
				<li class="nav-item">
					<a class="nav-link nav-action" href="#" id="mazeBtn">Simple Spiral</a>
				</li>
				<li class="nav-item">
					<span class="nav-link nav-fixed-label speedDisplay" id="speedLabel">Speed: Fast</span>
				</li>
			</ul>

			<button class="btn btn-outline-success btn-space" type="button" id="startBtn">Start DFS</button>
			<button class="btn btn-outline-warning btn-space" type="button" id="clearBtn">Clear</button>
		</div>
	</nav>

	<div class="d-flex flex-row flex-wrap m-2 justify-content-around">
		<div class="d-flex p-2">
			<div class="key wall"></div>
			<div> Wall</div>
		</div>
		<div class="d-flex p-2">
			<div class="key start"></div>
			<div>Start</div>
		</div>
		<div class="d-flex p-2">
			<div class="key end"></div>
			<div>Target</div>
		</div>
		<div class="d-flex p-2">
			<div class="key searching"></div>
			<div class="key visited"></div>
			<div>Visited</div>
		</div>
		<div class="d-flex p-2">
			<div class="key success"></div>
			<div>Path</div>
		</div>
		<div class="d-flex p-2">
			<div class="key"></div>
			<div>Unvisited</div>
		</div>
	</div>

	<div class="d-flex flex-column align-items-center" id="bigTableContainer">
		<div id="tableContainer"></div>
	</div>

	<div class="d-flex flex-column" id="results">
		<div class="d-flex justify-content-center">
			<i id="resultsIcon" class="fas fa-exclamation"></i>
		</div>
		<div id="duration" class="d-flex justify-content-center">
			Press Start to run DFS.
		</div>
		<div id="length" class="d-flex justify-content-center">
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
		integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
		crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
		integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
		crossorigin="anonymous"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
		integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
		crossorigin="anonymous"></script>
	<script type="text/javascript" src="script.js"></script>
</body>

</html>
